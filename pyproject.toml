[project]
name = "options-volatility-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jacobcoons-coder", email = "coonsja@bc.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]

[project.scripts]
options-volatility-lab = "options_volatility_lab:main"

[build-system]
